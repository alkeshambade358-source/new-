<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everything I Love About You ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Poppins,sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(180deg,#fff9f5,#ffeee8);
position:relative;
}
.sun{
position:absolute;right:-60px;top:-60px;
width:180px;height:180px;border-radius:50%;
background:#FFD86A;box-shadow:0 0 50px rgba(255,216,106,.4);
}
.card{
width:min(92vw,430px);
background:#fff;
border-radius:28px;
padding:40px 30px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.12);
animation:float 4s ease-in-out infinite;
z-index:2;
}
@keyframes float{50%{transform:translateY(-8px)}}
.play{
width:95px;height:95px;
margin:auto;
border-radius:50%;
background:linear-gradient(135deg,#ff5b8a,#ff86ac);
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
color:#fff;
cursor:pointer;
transition:.3s;
box-shadow:0 15px 40px rgba(255,91,138,.35);
}
.play:hover{transform:scale(1.08)}
h1{
margin-top:28px;
font-size:54px;
font-family:"Cormorant Garamond",serif;
line-height:1.1;
color:#7b3f58;
}
p{margin-top:15px;color:#777}
.heart{
position:fixed;
bottom:-30px;
opacity:.35;
pointer-events:none;
animation:rise 10s linear infinite;
}
@keyframes rise{
from{transform:translateY(0)}
to{transform:translateY(-120vh)}
}
.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.88);
justify-content:center;
align-items:center;
z-index:99;
}
.modal video{
width:min(92vw,900px);
max-height:90vh;
border-radius:18px;
background:#000;
}
.close{
position:absolute;
top:20px;
right:30px;
font-size:44px;
color:#fff;
cursor:pointer;
}
</style>
</head>
<body>

<div class="sun"></div>

<div class="card">
<div class="play" onclick="openVideo()">▶</div>
<h1>Everything I Love About You</h1>
<p>Click the play button to watch ❤️</p>
</div>

<div class="modal" id="modal">
<div class="close" onclick="closeVideo()">×</div>
<video id="video" controls>
<source src="video.mp4" type="video/mp4">
</video>
</div>

<script>
const modal=document.getElementById('modal');
const video=document.getElementById('video');

function openVideo(){
 modal.style.display='flex';
 video.currentTime=0;
 video.play().catch(()=>{});
}
function closeVideo(){
 video.pause();
 video.currentTime=0;
 modal.style.display='none';
}
modal.addEventListener('click',e=>{
 if(e.target===modal) closeVideo();
});

setInterval(()=>{
 const h=document.createElement('div');
 h.className='heart';
 h.innerHTML=['❤️','💕','💖','💗'][Math.floor(Math.random()*4)];
 h.style.left=Math.random()*100+'vw';
 h.style.fontSize=(16+Math.random()*18)+'px';
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),10000);
},900);
</script>

</body>
</html>
